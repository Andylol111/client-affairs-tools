name: Production
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.contract.outputs.phase }}
    steps:
      - id: contract
        name: Choose Production waterfall
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.head_ref }}
          REF: ${{ github.ref }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            test "$SAME_REPOSITORY" = true
            test "$SOURCE" = 'feature'
          fi
          if [ "$EVENT" = pull_request ] || { [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; }; then
            echo phase=verify >> "$GITHUB_OUTPUT"
            echo 'Production: feature → main. All boundaries plus image. No ship until main.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo phase=ship >> "$GITHUB_OUTPUT"
            echo 'Production: main push. Rebuild the image and ship the live box after environment approval.' >> "$GITHUB_STEP_SUMMARY"
          fi
  prove:
    needs: route
    uses: ./.github/workflows/verify.yml
    with:
      stage: production
      phase: ${{ needs.route.outputs.phase }}
  required-checks:
    if: ${{ always() && !cancelled() }}
    needs: [route, prove]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage verification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
  deploy:
    needs: [required-checks, prove]
    if: needs.prove.outputs.runtime == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      archive_sha256: ${{ needs.prove.outputs.archive_sha256 }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  outcome:
    if: ${{ always() && !cancelled() }}
    needs: [required-checks, prove, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment eligibility and reject unexpected skips
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUNTIME: ${{ needs.prove.outputs.runtime }}
          VERIFIED: ${{ needs.required-checks.result }}
          DEPLOYED: ${{ needs.deploy.result }}
        run: |
          test "$VERIFIED" = success
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$REF" = refs/heads/main ] && [ "$RUNTIME" = true ]; then
            test "$DEPLOYED" = success
            echo 'production deployment and health checks passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No deployment: PR/manual verification, non-main ref, or no runtime changes. All selected checks passed.' >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    needs: deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record deployed revision and semantic version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: production
        run: python3 scripts/release_version.py
  promote:
    needs: outcome
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge or open the next club branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_DISPATCH: '1'
          PROMOTION_STAGE: Production
        run: |
          python3 - <<'PY'
          import json, os
          path = os.environ['GITHUB_EVENT_PATH']
          event = json.load(open(path, encoding='utf-8'))
          if 'workflow_run' not in event:
              pull = event.get('pull_request') or {}
              head = pull.get('head') or {}
              json.dump({'workflow_run': {
                  'name': os.environ['PROMOTION_STAGE'],
                  'event': os.environ['GITHUB_EVENT_NAME'],
                  'conclusion': 'success',
                  'head_sha': head.get('sha') or os.environ['GITHUB_SHA'],
                  'head_branch': head.get('ref') or os.environ['GITHUB_REF_NAME'],
                  'head_repository': {'full_name': os.environ['GITHUB_REPOSITORY']},
                  'html_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  'pull_requests': [{'number': pull['number']}] if pull.get('number') else [],
              }}, open(path, 'w', encoding='utf-8'))
          PY
          python3 scripts/promote.py
