name: Production · Feature to Main
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Club delivery, or a reviewed infrastructure/static action
        type: choice
        options: [deliver, plan, apply, publish-static]
        default: deliver
      target:
        description: Terraform target (plan/apply only)
        type: choice
        options: [production, beta]
        default: production
      production_run_id:
        description: Successful Production delivery run (publish-static only)
        type: string
      plan_run_id:
        description: Run ID of the reviewed saved plan (apply only)
        type: string
      plan_sha256:
        description: Exact SHA256 from the reviewed plan (apply only)
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.contract.outputs.phase }}
    steps:
      - id: contract
        name: Choose Production waterfall
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          OPERATION: ${{ inputs.operation || 'deliver' }}
        run: |
          if [ "$OPERATION" != deliver ]; then
            test "$REF" = refs/heads/main
            case "$OPERATION" in plan|apply|publish-static) ;; *) exit 1 ;; esac
            echo phase=maintenance >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$REF" in refs/heads/feature|refs/heads/main) ;; *) exit 1 ;; esac
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo phase=verify >> "$GITHUB_OUTPUT"
            echo 'Production: feature → main. All boundaries plus image. No ship until main.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo phase=ship >> "$GITHUB_OUTPUT"
            echo 'Production: main. Rebuild the image and ship the live box after environment approval.' >> "$GITHUB_STEP_SUMMARY"
          fi
  scope:
    needs: route
    if: needs.route.outputs.phase != 'maintenance'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      scope: ${{ steps.classify.outputs.scope }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infra: ${{ steps.classify.outputs.infra }}
      image: ${{ steps.classify.outputs.image }}
      security: ${{ steps.classify.outputs.security }}
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/scope
        id: classify
        with:
          stage: production
          phase: ${{ needs.route.outputs.phase }}
  backend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/backend
        with:
          stage: production
  frontend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
        with:
          stage: production
  infra:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/infra
  security:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/security
  image:
    timeout-minutes: 20
    needs: [route, scope]
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/image
        id: build
        with:
          stage: production
          phase: ${{ needs.route.outputs.phase }}
          runtime: ${{ needs.scope.outputs.runtime }}
  gate:
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deliver') }}
    needs: [scope, backend, frontend, infra, security, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate
        with:
          scope: ${{ needs.scope.outputs.scope }}
          results: ${{ toJSON(needs) }}
  required-checks:
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deliver') }}
    needs: [route, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage verification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
  deploy:
    needs: [required-checks, scope, image]
    if: needs.scope.outputs.runtime == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deliver'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      PRODUCTION_INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
      YUCG_ENV: ${{ vars.YUCG_ENV }}
      DEPLOYMENT_ENV: production
      EXPECTED_ARCHIVE_SHA256: ${{ needs.image.outputs.archive_sha256 }}
      DATA_OWNER_MIGRATION_APPROVED: ${{ vars.DATA_OWNER_MIGRATION_APPROVED }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ship
        with:
          role: ${{ vars.AWS_SHIP_ROLE_ARN }}
  outcome:
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deliver') }}
    needs: [required-checks, scope, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment eligibility and reject unexpected skips
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUNTIME: ${{ needs.scope.outputs.runtime }}
          VERIFIED: ${{ needs.required-checks.result }}
          DEPLOYED: ${{ needs.deploy.result }}
        run: |
          test "$VERIFIED" = success
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$REF" = refs/heads/main ] && [ "$RUNTIME" = true ]; then
            test "$DEPLOYED" = success
            echo 'production deployment and health checks passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No deployment: PR/manual verification, non-main ref, or no runtime changes. All selected checks passed.' >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    needs: deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record deployed revision and semantic version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: production
        run: python3 scripts/release_version.py
  promote:
    needs: outcome
    if: ${{ !cancelled() && needs.outcome.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Load trusted code already on main; the new composites need not exist there yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Advance the next club branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_DISPATCH: '1'
          PROMOTION_STAGE: Production
        run: python3 scripts/promote.py
  infrastructure:
    needs: route
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'plan' || inputs.operation == 'apply') && github.ref == 'refs/heads/main' }}
    environment: infrastructure-${{ inputs.target }}-${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash infra/scripts/install-terraform.sh
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.TF_REGION }}
          allowed-account-ids: ${{ vars.TF_ACCOUNT_ID }}
          retry-max-attempts: 3
      - name: Execute the reviewed infrastructure operation
        env:
          OPERATION: ${{ inputs.operation }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          APPROVED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          TF_TARGET: ${{ inputs.target }}
          TF_REGION: ${{ vars.TF_REGION }}
          TF_ACCOUNT_ID: ${{ vars.TF_ACCOUNT_ID }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_BUCKET_PREFIX: ${{ vars.TF_BUCKET_PREFIX }}
          TF_FRONTEND_ORIGIN: ${{ vars.TF_FRONTEND_ORIGIN }}
          TF_ENABLE_NEW_STORAGE: ${{ vars.TF_ENABLE_NEW_STORAGE }}
        run: bash infra/scripts/terraform-release.sh "$OPERATION"
  publish-static:
    needs: route
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-static' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      STATIC_BUCKET: ${{ vars.STATIC_BUCKET }}
      STATIC_CUTOVER_APPROVED: ${{ vars.STATIC_CUTOVER_APPROVED }}
      STATIC_INVALIDATION_APPROVED: ${{ vars.STATIC_INVALIDATION_APPROVED }}
      STATIC_DISTRIBUTION_ID: ${{ vars.STATIC_DISTRIBUTION_ID }}
    steps:
      - name: Require completed S3 origin cutover
        run: test "$STATIC_CUTOVER_APPROVED" = true && test -n "$STATIC_BUCKET"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require successful production delivery of this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.production_run_id }}
        run: |
          [[ "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" | jq -e \
            --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.name == "Production · Feature to Main" and (.event == "push" or .event == "workflow_dispatch") and .head_branch == "main" and .head_sha == $sha and .head_repository.full_name == $repo and .conclusion == "success"'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: yucg-static-${{ github.sha }}
          path: /tmp/yucg-static
          github-token: ${{ github.token }}
          run-id: ${{ inputs.production_run_id }}
      - name: Check and extract the frontend bundled in the verified image
        run: |
          cd /tmp/yucg-static
          sha256sum -c SHA256SUMS
          mkdir dist
          tar -xzf frontend.tar.gz -C dist
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_STATIC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: bash infra/scripts/publish-static.sh /tmp/yucg-static/dist
