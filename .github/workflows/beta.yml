name: Beta · Develop to Feature
on:
  push:
    branches: [feature]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.contract.outputs.phase }}
    steps:
      - id: contract
        name: Choose Beta waterfall
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "$REF" in refs/heads/develop|refs/heads/feature) ;; *) exit 1 ;; esac
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/feature ]; then
            echo phase=verify >> "$GITHUB_OUTPUT"
            echo 'Beta: develop → feature. Full candidate including image. Live box is not this stage.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo phase=ship >> "$GITHUB_OUTPUT"
            echo 'Beta: feature. Image only. Deploy only if BETA_AWS_INSTANCE_ID names a non-production box.' >> "$GITHUB_STEP_SUMMARY"
          fi
  scope:
    needs: route
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      scope: ${{ steps.classify.outputs.scope }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infra: ${{ steps.classify.outputs.infra }}
      image: ${{ steps.classify.outputs.image }}
      security: ${{ steps.classify.outputs.security }}
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/scope
        id: classify
        with:
          stage: beta
          phase: ${{ needs.route.outputs.phase }}
  backend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/backend
        with:
          stage: beta
  frontend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
        with:
          stage: beta
  infra:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/infra
  security:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.security == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/security
  image:
    timeout-minutes: 20
    needs: [route, scope]
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/image
        id: build
        with:
          stage: beta
          phase: ${{ needs.route.outputs.phase }}
          runtime: ${{ needs.scope.outputs.runtime }}
  gate:
    if: ${{ always() && !cancelled() }}
    needs: [scope, backend, frontend, infra, security, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate
        with:
          scope: ${{ needs.scope.outputs.scope }}
          results: ${{ toJSON(needs) }}
  required-checks:
    if: ${{ always() && !cancelled() }}
    needs: [route, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage verification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
  deploy:
    needs: [required-checks, scope, image]
    if: ${{ always() && !cancelled() && needs.required-checks.result == 'success' && needs.scope.result == 'success' && needs.image.result == 'success' && needs.scope.outputs.runtime == 'true' && vars.BETA_AWS_INSTANCE_ID != '' && github.ref == 'refs/heads/feature' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: beta
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      AWS_INSTANCE_ID: ${{ vars.BETA_AWS_INSTANCE_ID }}
      PRODUCTION_INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
      YUCG_ENV: ${{ vars.YUCG_ENV }}
      DEPLOYMENT_ENV: beta
      EXPECTED_ARCHIVE_SHA256: ${{ needs.image.outputs.archive_sha256 }}
      DATA_OWNER_MIGRATION_APPROVED: ${{ vars.DATA_OWNER_MIGRATION_APPROVED }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ship
        with:
          role: ${{ vars.AWS_SHIP_ROLE_ARN }}
  outcome:
    if: ${{ always() && !cancelled() }}
    needs: [required-checks, scope, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment eligibility and reject unexpected skips
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUNTIME: ${{ needs.scope.outputs.runtime }}
          VERIFIED: ${{ needs.required-checks.result }}
          DEPLOYED: ${{ needs.deploy.result }}
          BETA_HOST: ${{ vars.BETA_AWS_INSTANCE_ID }}
        run: |
          test "$VERIFIED" = success
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$REF" = refs/heads/feature ] && [ "$RUNTIME" = true ]; then
            if [ -z "$BETA_HOST" ]; then
              test "$DEPLOYED" = skipped
              echo 'Beta verification passed. No beta host is configured (BETA_AWS_INSTANCE_ID), so nothing was deployed. The live box stays production-only.' >> "$GITHUB_STEP_SUMMARY"
            else
              test "$DEPLOYED" = success
              echo 'beta deployment and health checks passed.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'No deployment: PR/manual verification, non-feature ref, or no runtime changes. All selected checks passed.' >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    needs: deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record deployed revision and semantic version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: beta
        run: python3 scripts/release_version.py
  promote:
    needs: outcome
    if: ${{ !cancelled() && needs.outcome.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Load trusted code already on main; the new composites need not exist there yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Advance the next club branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_DISPATCH: '1'
          PROMOTION_STAGE: Beta
        run: python3 scripts/promote.py
