name: Beta
on:
  pull_request:
    branches: [feature]
  push:
    branches: [feature]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promotion direction
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.head_ref }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            test "$SAME_REPOSITORY" = true
            test "$SOURCE" = 'develop'
          fi
  verify:
    needs: route
    uses: ./.github/workflows/verify.yml
    with:
      stage: beta
  required-checks:
    if: always()
    needs: [route, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage verification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
  deploy:
    needs: [required-checks, verify]
    if: github.event_name == 'push' && needs.verify.outputs.runtime == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: beta
      archive_sha256: ${{ needs.verify.outputs.archive_sha256 }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  outcome:
    if: always()
    needs: [required-checks, verify, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment eligibility and reject unexpected skips
        env:
          EVENT: ${{ github.event_name }}
          RUNTIME: ${{ needs.verify.outputs.runtime }}
          VERIFIED: ${{ needs.required-checks.result }}
          DEPLOYED: ${{ needs.deploy.result }}
        run: |
          test "$VERIFIED" = success
          if [ "$EVENT" = push ] && [ "$RUNTIME" = true ]; then
            test "$DEPLOYED" = success
            echo 'beta deployment and health checks passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No deployment: PR/manual verification or no runtime changes. All selected checks passed.' >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    needs: deploy
    if: github.event_name == 'push' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record deployed revision and semantic version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: beta
        run: python3 scripts/release_version.py
