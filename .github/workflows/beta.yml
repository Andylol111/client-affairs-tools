name: Beta
on:
  pull_request:
    branches: [feature]
  push:
    branches: [feature]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promotion direction
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.head_ref }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            test "$SAME_REPOSITORY" = true
            test "$SOURCE" = 'develop'
          fi
  verify:
    needs: route
    uses: ./.github/workflows/verify.yml
    with:
      stage: beta
  required-checks:
    if: always()
    needs: [route, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful stage verification
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
  deploy:
    needs: [required-checks, verify]
    if: needs.verify.outputs.runtime == 'true' && vars.BETA_AWS_INSTANCE_ID != '' && github.ref == 'refs/heads/feature' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: beta
      archive_sha256: ${{ needs.verify.outputs.archive_sha256 }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  outcome:
    if: always()
    needs: [required-checks, verify, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment eligibility and reject unexpected skips
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUNTIME: ${{ needs.verify.outputs.runtime }}
          VERIFIED: ${{ needs.required-checks.result }}
          DEPLOYED: ${{ needs.deploy.result }}
          BETA_HOST: ${{ vars.BETA_AWS_INSTANCE_ID }}
        run: |
          test "$VERIFIED" = success
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$REF" = refs/heads/feature ] && [ "$RUNTIME" = true ]; then
            if [ -z "$BETA_HOST" ]; then
              test "$DEPLOYED" = skipped
              echo 'Beta verification passed. No beta host is configured (BETA_AWS_INSTANCE_ID), so nothing was deployed. The live box stays production-only.' >> "$GITHUB_STEP_SUMMARY"
            else
              test "$DEPLOYED" = success
              echo 'beta deployment and health checks passed.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'No deployment: PR/manual verification, non-feature ref, or no runtime changes. All selected checks passed.' >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    needs: deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record deployed revision and semantic version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: beta
        run: python3 scripts/release_version.py
  promote:
    needs: outcome
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge or open the next club branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_DISPATCH: '1'
          PROMOTION_STAGE: Beta
        run: |
          python3 - <<'PY'
          import json, os
          path = os.environ['GITHUB_EVENT_PATH']
          event = json.load(open(path, encoding='utf-8'))
          if 'workflow_run' not in event:
              pull = event.get('pull_request') or {}
              head = pull.get('head') or {}
              json.dump({'workflow_run': {
                  'name': os.environ['PROMOTION_STAGE'],
                  'event': os.environ['GITHUB_EVENT_NAME'],
                  'conclusion': 'success',
                  'head_sha': head.get('sha') or os.environ['GITHUB_SHA'],
                  'head_branch': head.get('ref') or os.environ['GITHUB_REF_NAME'],
                  'head_repository': {'full_name': os.environ['GITHUB_REPOSITORY']},
                  'html_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  'pull_requests': [{'number': pull['number']}] if pull.get('number') else [],
              }}, open(path, 'w', encoding='utf-8'))
          PY
          python3 scripts/promote.py
