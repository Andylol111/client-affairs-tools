name: Deploy verified application
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      archive_sha256:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      PRODUCTION_INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
      YUCG_ENV: ${{ vars.YUCG_ENV }}
      DEPLOYMENT_ENV: ${{ inputs.environment }}
      EXPECTED_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      DATA_OWNER_MIGRATION_APPROVED: ${{ vars.DATA_OWNER_MIGRATION_APPROVED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require an explicit environment binding
        env:
          ROLE: ${{ vars.AWS_SHIP_ROLE_ARN }}
        run: |
          test -n "$ROLE"
          test -n "$AWS_REGION"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_STACK_NAME"
          test -n "$AWS_INSTANCE_ID"
          test -n "$YUCG_ENV"
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          case "$DEPLOYMENT_ENV:$GITHUB_REF" in
            beta:refs/heads/feature|production:refs/heads/main) ;;
            *) exit 1 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_SHIP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          retry-max-attempts: 3
      - name: Install the ECR credential helper
        run: sudo apt-get update -qq && sudo apt-get install -y amazon-ecr-credential-helper
      - name: Verify actual AWS target security before deployment
        run: python3 infra/scripts/check_deployment.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: yucg-image-${{ github.sha }}
          path: /tmp/yucg-image
      - name: Push verified image and restart box
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID"
          ECR_HOST="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          # CDK asset repo tags are immutable; :live cannot be overwritten.
          IMAGE="${ECR_HOST}/cdk-hnb659fds-container-assets-${ACCOUNT}-${AWS_REGION}:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          ID="$(aws cloudformation describe-stacks --stack-name "${AWS_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)"
          test -n "$ID"
          test "$ID" = "$AWS_INSTANCE_ID"
          if [ "$DEPLOYMENT_ENV" = beta ]; then
            test -n "$PRODUCTION_INSTANCE_ID"
            test "$ID" != "$PRODUCTION_INSTANCE_ID"
          fi

          source infra/scripts/ecr-credentials.sh
          echo "${EXPECTED_ARCHIVE_SHA256}  /tmp/yucg-image/yucg-image.tar" | sha256sum -c -
          docker load -i /tmp/yucg-image/yucg-image.tar
          docker tag "yucg-check:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"
          DIGEST="$(aws ecr describe-images --repository-name "cdk-hnb659fds-container-assets-${ACCOUNT}-${AWS_REGION}" --image-ids imageTag="${GITHUB_SHA}-${GITHUB_RUN_ID}" --query 'imageDetails[0].imageDigest' --output text)"
          IMAGE="${IMAGE%:*}@${DIGEST}"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          export IMAGE ECR_HOST AWS_REGION YUCG_ENV DATA_OWNER_MIGRATION_APPROVED DEPLOYMENT_ENV
          envsubst '$IMAGE $ECR_HOST $AWS_REGION $YUCG_ENV $DATA_OWNER_MIGRATION_APPROVED $DEPLOYMENT_ENV' < infra/scripts/restart-yucg.sh > /tmp/restart-yucg.sh
          jq -n --rawfile script /tmp/restart-yucg.sh \
            --arg id "$ID" \
            '{
              InstanceIds: [$id],
              DocumentName: "AWS-RunShellScript",
              Comment: "yucg ship",
              Parameters: { commands: [$script] }
            }' > /tmp/ssm-send.json
          CMD_ID="$(aws ssm send-command --cli-input-json file:///tmp/ssm-send.json --query Command.CommandId --output text)"
          # Default SSM waiter expires too soon for image pulls plus rollback checks.
          STATUS=Pending
          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "$STATUS" = Success

      - name: Verify public application health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          [[ "$HEALTH_URL" == https://* ]]
          curl --fail --silent --show-error --max-time 20 --retry 3 "$HEALTH_URL" | jq -e '.status == "ok"'
