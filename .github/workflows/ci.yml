name: verify and ship

on:
  pull_request:
    branches: [develop, feature, main]
  push:
    branches: [develop, feature, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify-backend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install and test
        env:
          JWT_SECRET: p2-test-secret-not-a-known-default-xx
        run: |
          python -m pip install --require-hashes -q -r requirements.lock
          python -m pip install -q -r requirements-dev.txt
          python scripts/test_suite.py


  verify-frontend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: yucg-frontend-${{ github.sha }}
          path: frontend/dist
          retention-days: 2
          if-no-files-found: error

  verify-infra:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: bash -n scripts/restart-yucg.sh scripts/publish-static.sh scripts/backup-to-s3.sh lib/user-data.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Terraform without AWS access or remote state
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.10.5/terraform_1.10.5_linux_amd64.zip -o /tmp/terraform.zip
          echo "0566a24f5332098b15716ebc394be503f4094acba5ba529bf5eb0698ed5e2a90  /tmp/terraform.zip" | sha256sum -c -
          unzip /tmp/terraform.zip -d /tmp/terraform-bin
          /tmp/terraform-bin/terraform -chdir=../terraform fmt -check
          /tmp/terraform-bin/terraform -chdir=../terraform init -backend=false -lockfile=readonly
          /tmp/terraform-bin/terraform -chdir=../terraform validate

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.9.0 bandit==1.8.3
      - run: pip-audit -r backend/requirements.lock
      - run: bandit -r backend/app backend/main.py -lll -iii
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: fs
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'


  required-checks:
    if: always()
    needs: [verify-backend, verify-frontend, verify-infra, security, build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  build-image:
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    needs: [verify-backend, verify-frontend, verify-infra, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Docker build
        run: docker build --platform linux/amd64 -f docker/app.Dockerfile -t yucg-check:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: yucg-check:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Verify non-root container startup and database initialization
        run: |
          docker run --rm --network none --entrypoint python \
            -e JWT_SECRET=ci-container-test-secret-not-for-production \
            -e DATABASE_URL=sqlite:////data/smoke.db \
            "yucg-check:${GITHUB_SHA}" \
            scripts/container_smoke.py
      - name: Verify backend behavior on the runtime libc
        run: |
          docker run --rm --network none --entrypoint python \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/infra/lib,target=/infra/lib,readonly" \
            -e JWT_SECRET=ci-container-test-secret-not-for-production \
            "yucg-check:${GITHUB_SHA}" \
            -c 'import glob, subprocess, sys; tests=sorted(glob.glob("tests/test_*.py")); assert tests, "No regression scripts found"; results=[subprocess.run([sys.executable, path], timeout=180).returncode for path in tests]; sys.exit(any(results))'
      - name: Preserve verified image
        id: archive
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker save yucg-check:${{ github.sha }} -o /tmp/yucg-image.tar
          echo "sha256=$(sha256sum /tmp/yucg-image.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: yucg-image-${{ github.sha }}
          path: /tmp/yucg-image.tar
          retention-days: 2
          if-no-files-found: error

  ship:
    needs: [required-checks, build-image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_SHIP_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      YUCG_ENV: dev
      EXPECTED_ARCHIVE_SHA256: ${{ needs.build-image.outputs.archive_sha256 }}
      DATA_OWNER_MIGRATION_APPROVED: ${{ vars.DATA_OWNER_MIGRATION_APPROVED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: ${{ vars.AWS_SHIP_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: fs
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: yucg-image-${{ github.sha }}
          path: /tmp/yucg-image
      - name: Push verified image and restart box
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ECR_HOST="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          # CDK asset repo tags are immutable; :live cannot be overwritten.
          IMAGE="${ECR_HOST}/cdk-hnb659fds-container-assets-${ACCOUNT}-${AWS_REGION}:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          ID="$(aws cloudformation describe-stacks --stack-name "YucgOutreach-${YUCG_ENV}" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)"
          test -n "$ID"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_HOST"
          echo "${EXPECTED_ARCHIVE_SHA256}  /tmp/yucg-image/yucg-image.tar" | sha256sum -c -
          docker load -i /tmp/yucg-image/yucg-image.tar
          docker tag "yucg-check:${GITHUB_SHA}" "$IMAGE"
          # Scan the exact image that will be pushed using the pinned action-installed scanner.
          trivy image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln,secret "$IMAGE"
          docker push "$IMAGE"
          DIGEST="$(aws ecr describe-images --repository-name "cdk-hnb659fds-container-assets-${ACCOUNT}-${AWS_REGION}" --image-ids imageTag="${GITHUB_SHA}-${GITHUB_RUN_ID}" --query 'imageDetails[0].imageDigest' --output text)"
          IMAGE="${IMAGE%:*}@${DIGEST}"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          export IMAGE ECR_HOST AWS_REGION YUCG_ENV DATA_OWNER_MIGRATION_APPROVED
          envsubst '$IMAGE $ECR_HOST $AWS_REGION $YUCG_ENV $DATA_OWNER_MIGRATION_APPROVED' < infra/scripts/restart-yucg.sh > /tmp/restart-yucg.sh
          jq -n --rawfile script /tmp/restart-yucg.sh \
            --arg id "$ID" \
            '{
              InstanceIds: [$id],
              DocumentName: "AWS-RunShellScript",
              Comment: "yucg ship",
              Parameters: { commands: [$script] }
            }' > /tmp/ssm-send.json
          CMD_ID="$(aws ssm send-command --cli-input-json file:///tmp/ssm-send.json --query Command.CommandId --output text)"
          # Default SSM waiter expires too soon for image pulls plus rollback checks.
          STATUS=Pending
          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "$STATUS" = Success

  publish-static:
    needs: [required-checks, ship]
    if: github.ref == 'refs/heads/main' && vars.STATIC_CUTOVER_APPROVED == 'true' && vars.STATIC_BUCKET != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      STATIC_BUCKET: ${{ vars.STATIC_BUCKET }}
      STATIC_CUTOVER_APPROVED: ${{ vars.STATIC_CUTOVER_APPROVED }}
      STATIC_INVALIDATION_APPROVED: ${{ vars.STATIC_INVALIDATION_APPROVED }}
      STATIC_DISTRIBUTION_ID: ${{ vars.STATIC_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: yucg-frontend-${{ github.sha }}
          path: /tmp/yucg-frontend
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          role-to-assume: ${{ vars.AWS_STATIC_ROLE_ARN }}
          aws-region: us-east-1
      - run: bash infra/scripts/publish-static.sh /tmp/yucg-frontend
