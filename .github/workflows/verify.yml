name: Shared verification
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
    outputs:
      runtime:
        value: ${{ jobs.scope.outputs.runtime }}
      archive_sha256:
        value: ${{ jobs.image.outputs.archive_sha256 }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.changes.outputs.scope }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      infra: ${{ steps.changes.outputs.infra }}
      image: ${{ steps.changes.outputs.image }}
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STAGE: ${{ inputs.stage }}
        run: python3 scripts/ci_policy.py "$STAGE"
  backend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install and test
        env:
          JWT_SECRET: p2-test-secret-not-a-known-default-xx
        run: |
          python -m pip install --require-hashes -q -r requirements.lock
          python -m pip install -q -r requirements-dev.txt
          python scripts/test_suite.py


      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-${{ inputs.stage }}-${{ github.sha }}
          path: backend/coverage.xml
          retention-days: 3
          if-no-files-found: error

  frontend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  infra:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: for script in scripts/*.sh lib/user-data.sh; do bash -n "$script"; done
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install checksum-verified Terraform
        run: bash scripts/install-terraform.sh
      - name: Validate and exercise infrastructure contracts without AWS credentials
        run: |
          terraform -chdir=../terraform fmt -check -recursive
          terraform -chdir=../terraform init -backend=false -lockfile=readonly
          terraform -chdir=../terraform validate
          terraform -chdir=../terraform test

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint workflow permissions, expressions, dependencies, and shell
        run: bash infra/scripts/lint-workflows.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.9.0 bandit==1.8.3
      - run: pip-audit -r backend/requirements.lock
      - run: bandit -r backend/app backend/main.py -lll -iii
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: fs
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'



  image:
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    needs: scope
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Docker build
        run: docker build --platform linux/amd64 -f docker/app.Dockerfile -t yucg-check:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: yucg-check:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Verify non-root container startup and database initialization
        run: |
          docker run --rm --network none --entrypoint python \
            -e JWT_SECRET=ci-container-test-secret-not-for-production \
            -e DATABASE_URL=sqlite:////data/smoke.db \
            "yucg-check:${GITHUB_SHA}" \
            scripts/container_smoke.py
      - name: Verify backend behavior on the runtime libc
        run: |
          docker run --rm --network none --entrypoint python \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/infra/lib,target=/infra/lib,readonly" \
            -e JWT_SECRET=ci-container-test-secret-not-for-production \
            "yucg-check:${GITHUB_SHA}" \
            -c 'import glob, subprocess, sys; tests=sorted(glob.glob("tests/test_*.py")); assert tests, "No regression scripts found"; results=[subprocess.run([sys.executable, path], timeout=180).returncode for path in tests]; sys.exit(any(results))'
      - name: Preserve verified image
        id: archive
        if: github.event_name == 'push' && inputs.stage != 'intake' && needs.scope.outputs.runtime == 'true'
        run: |
          docker save yucg-check:${{ github.sha }} -o /tmp/yucg-image.tar
          echo "sha256=$(sha256sum /tmp/yucg-image.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'push' && inputs.stage != 'intake' && needs.scope.outputs.runtime == 'true'
        with:
          name: yucg-image-${{ github.sha }}
          path: /tmp/yucg-image.tar
          retention-days: 2
          if-no-files-found: error

      - name: Extract optional static release from the verified image
        if: github.event_name == 'push' && inputs.stage == 'production' && needs.scope.outputs.runtime == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/yucg-static/dist
          STATIC_CONTAINER="$(docker create "yucg-check:${GITHUB_SHA}")"
          trap 'docker rm "$STATIC_CONTAINER"' EXIT
          docker cp "$STATIC_CONTAINER:/app/frontend_dist/." /tmp/yucg-static/dist/
          tar -czf /tmp/yucg-static/frontend.tar.gz -C /tmp/yucg-static/dist .
          cd /tmp/yucg-static
          sha256sum frontend.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'push' && inputs.stage == 'production' && needs.scope.outputs.runtime == 'true'
        with:
          name: yucg-static-${{ github.sha }}
          path: |
            /tmp/yucg-static/frontend.tar.gz
            /tmp/yucg-static/SHA256SUMS
          retention-days: 3
          if-no-files-found: error


  gate:
    if: ${{ always() && !cancelled() }}
    needs: [scope, backend, frontend, infra, security, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Account for every required or intentionally excluded check
        env:
          SCOPE: ${{ needs.scope.outputs.scope }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          from scripts.ci_policy import check_results
          results = json.loads(os.environ['RESULTS'])
          if results['scope']['result'] != 'success':
              sys.exit('Change classification failed; no checks may be bypassed')
          errors = check_results(json.loads(os.environ['SCOPE']), results)
          for error in errors: print(error)
          sys.exit(bool(errors))
          PYTHON
