name: Promote verified changes
on:
  workflow_run:
    workflows: [Intake, Beta, Production]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
concurrency:
  group: promotion-controller
  cancel-in-progress: false
jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Choose promotion identity
        id: token
        env:
          APP_ID: ${{ vars.PROMOTION_APP_ID }}
          APP_KEY: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo mode=app >> "$GITHUB_OUTPUT"
            echo 'Using the repository GitHub App. Pull request and push events start the next stage on their own.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo mode=actions >> "$GITHUB_OUTPUT"
            echo 'Using GITHUB_TOKEN. After a merge or promotion PR, Promote dispatches the next stage (Intake, Beta, or Production). Actions tokens do not start those workflows from the events they create.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # Trusted default branch only — never the workflow_run head or PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - if: steps.token.outputs.mode == 'app'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: client-affairs-tools
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: write
      - name: Open or merge eligible candidates
        env:
          GH_TOKEN: ${{ steps.token.outputs.mode == 'app' && steps.app.outputs.token || github.token }}
          PROMOTION_DISPATCH: ${{ steps.token.outputs.mode == 'actions' && '1' || '0' }}
        run: python3 scripts/promote.py
