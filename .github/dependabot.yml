version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /infra
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      infrastructure-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /backend
    target-branch: develop
    schedule:
      interval: monthly
    # requirements.lock is hash-pinned and must be regenerated and tested as one
    # reviewed change; manifest-only version PRs do not change production.
    open-pull-requests-limit: 0
  - package-ecosystem: terraform
    directory: /terraform
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
