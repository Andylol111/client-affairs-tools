version: 2
updates:
  - package-ecosystem: npm
    directories: [/frontend, /infra]
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      compatible-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    target-branch: develop
    schedule:
      interval: monthly
    # Hash lock must be regenerated with each manifest change; no manifest-only autopromotion.
    open-pull-requests-limit: 0
  - package-ecosystem: terraform
    directory: /terraform
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      providers:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
