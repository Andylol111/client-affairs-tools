name: Classify the diff
description: Classify the diff for staged club delivery.
inputs:
  stage:
    description: Stage supplied by the stage workflow.
    required: true
  phase:
    description: Phase supplied by the stage workflow.
    required: true
outputs:
  lane:
    description: Fast patch or standard progression lane.
    value: ${{ steps.changes.outputs.lane }}
  scope:
    description: Scope computed for this revision.
    value: ${{ steps.changes.outputs.scope }}
  backend:
    description: Backend computed for this revision.
    value: ${{ steps.changes.outputs.backend }}
  frontend:
    description: Frontend computed for this revision.
    value: ${{ steps.changes.outputs.frontend }}
  infra:
    description: Infra computed for this revision.
    value: ${{ steps.changes.outputs.infra }}
  image:
    description: Image computed for this revision.
    value: ${{ steps.changes.outputs.image }}
  security:
    description: Security computed for this revision.
    value: ${{ steps.changes.outputs.security }}
  runtime:
    description: Runtime computed for this revision.
    value: ${{ steps.changes.outputs.runtime }}
runs:
  using: composite
  steps:
    - id: changes
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        STAGE: ${{ inputs.stage }}
        PHASE: ${{ inputs.phase }}
      run: python3 scripts/ci_policy.py "$STAGE"
